<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Marketplace — Friends Trading Centre</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body data-page="market">
  <header class="site-header">
    <div class="container nav">
      <a class="brand" href="index.html">
        <span class="logo">F</span>
        <span class="brand-text"><b>Friends Trading Centre</b><span>SWAP · TRADE · SMILE</span></span>
      </a>
      <nav class="nav-links" id="navLinks"></nav>
      <div class="nav-auth" id="navAuth"></div>
    </div>
  </header>

  <!-- Cart Modal -->
  <div class="cart-modal" id="cartModal">
    <div class="cart-panel">
      <div class="cart-header">
        <h2>Shopping Cart 🛒</h2>
        <button class="cart-close" id="cartClose">✕</button>
      </div>
      <div class="cart-content">
        <div id="cartItems"></div>
      </div>
      <div class="cart-footer">
        <div class="cart-total">
          Total: <span id="cartTotal">🪙 0</span>
        </div>
        <button class="btn cart-checkout" id="cartCheckout">Ask to Buy All</button>
      </div>
    </div>
  </div>

  <section class="section">
    <div class="container">
      <div class="section-head">
        <h2>Toy Marketplace 🛒</h2>
        <p>Toys your friends are trading. Buy with coins — collect in person!</p>
      </div>
      <div style="text-align:right;margin-bottom:16px">
        <div class="cart-icon" id="cartBtn" style="display:inline-block">
          🛒<span class="cart-badge" id="cartCount" style="display:none">0</span>
        </div>
      </div>
      <div class="you-are" id="buyAllowance" style="display:none"></div>
      <div class="list-tools">
        <span class="search-ico">🔍</span>
        <input type="search" id="marketSearch" class="search-input" autocomplete="off"
               placeholder="Search a toy, a friend or a category…" aria-label="Search toys" />
      </div>
      <div class="filters" id="condFilters"></div>
      <div class="grid" id="marketGrid"></div>
      <div class="pager" id="marketPager"></div>
    </div>
  </section>

  <footer class="footer">
    <div class="container footer-bottom">
      © <span id="year"></span> Friends Trading Centre · Virtual coins only · Made with 💜 by Deshna
    </div>
  </footer>

  <script type="module" src="js/app.js"></script>
</body>
</html>
